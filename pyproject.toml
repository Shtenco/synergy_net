[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "synergynet-secure-transport"
version = "0.1.0"
description = "Durable authority-safe store-forward transport for SYNERGY Federation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
