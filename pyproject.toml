[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="synergynet-transport"
version="0.1.0a1"
requires-python=">=3.11"
[project.scripts]
synergynet-shttps-relay="synergynet_transport.main:main"
[project.optional-dependencies]
test=["pytest>=8"]
[tool.setuptools.packages.find]
where=["."]
include=["synergynet_transport*"]
[tool.pytest.ini_options]
testpaths=["tests"]
