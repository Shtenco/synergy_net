name: SynergyNet Persistent Store Codec v3

on:
  pull_request:
    paths:
      - 'src/synergynet/storage_v3.py'
      - 'src/synergynet/persistent_lab_v3.py'
      - 'tests/test_persistent_store_v3.py'
      - 'docs/PERSISTENT_STORE_CODEC_V3.md'
      - '.github/workflows/persistent-store-codec-v3.yml'
  workflow_dispatch:

concurrency:
  group: synergynet-persistent-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_persistent_store_v3.py
