name: SynergyNet Service Spec v1

on:
  pull_request:
    paths:
      - 'config/service_specs_v1/**'
      - 'src/synergynet/service_spec_v1.py'
      - 'schemas/synergy_service_spec_v1.schema.json'
      - 'tests/test_service_spec_v1.py'
      - 'docs/SERVICE_SPEC_V1.md'
      - '.github/workflows/service-spec-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest jsonschema
      - run: python -m pip install -e .
      - run: pytest -q tests/test_service_spec_v1.py
