name: research-transport-build-recipe-v1

on:
  pull_request:
    paths:
      - 'config/research_transport_build_recipe_v1.json'
      - 'src/synergynet/service_build_recipe_v1.py'
      - 'tools/build_research_transport_v1.py'
      - 'tests/test_research_transport_build_recipe_v1.py'
      - 'docs/RESEARCH_TRANSPORT_BUILD_RECIPE_V1.md'
      - '.github/workflows/research-transport-build-recipe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q tests/test_persistent_store_v3.py tests/test_persistent_content_service_v1.py tests/test_static_peer_relay_v1.py tests/test_research_transport_build_recipe_v1.py
      - run: mkdir -p dist/a dist/b
      - run: python tools/build_research_transport_v1.py --output dist/a/synergynet-research-transport-v1.zip --evidence dist/a/build-evidence.json
      - run: python tools/build_research_transport_v1.py --output dist/b/synergynet-research-transport-v1.zip --evidence dist/b/build-evidence.json
      - run: cmp dist/a/synergynet-research-transport-v1.zip dist/b/synergynet-research-transport-v1.zip
      - run: cmp dist/a/build-evidence.json dist/b/build-evidence.json
      - run: sha256sum dist/a/synergynet-research-transport-v1.zip dist/a/build-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: synergynet-research-transport-build-candidate-v1
          path: |
            dist/a/synergynet-research-transport-v1.zip
            dist/a/build-evidence.json
          if-no-files-found: error
