name: AUTOPILOT V5 AI Node Transport v1

on:
  pull_request:
    paths:
      - 'bindings/synergy_autopilot_v5_ai_node_transport_v1.json'
      - 'src/synergynet/autopilot_node_transport_v1.py'
      - 'tests/test_autopilot_node_transport_v1.py'
      - '.github/workflows/autopilot-v5-ai-node-transport-v1.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/test_autopilot_node_transport_v1.py
