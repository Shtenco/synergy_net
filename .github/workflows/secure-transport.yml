name: SynergyNet Secure Transport

on:
  push:
    paths:
      - 'src/synergynet_fabric/**'
      - 'tests/test_secure_transport.py'
      - 'pyproject.toml'
      - '.github/workflows/secure-transport.yml'
  pull_request:
    paths:
      - 'src/synergynet_fabric/**'
      - 'tests/test_secure_transport.py'
      - 'pyproject.toml'
      - '.github/workflows/secure-transport.yml'

jobs:
  secure-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - run: python -m compileall -q src
      - run: pytest -q tests/test_secure_transport.py
