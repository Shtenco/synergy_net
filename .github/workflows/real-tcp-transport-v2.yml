name: SynergyNet Real TCP Transport v2

on:
  pull_request:
    paths:
      - 'src/synergynet/tcp_transport.py'
      - 'src/synergynet/tcp_baseline.py'
      - 'tests/test_tcp_transport_v2.py'
      - 'benchmarks/run_tcp_v2.py'
      - 'docs/REAL_TCP_TRANSPORT_V2.md'
      - '.github/workflows/real-tcp-transport-v2.yml'
  workflow_dispatch:

concurrency:
  group: synergynet-real-tcp-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_tcp_transport_v2.py
      - run: python benchmarks/run_tcp_v2.py
