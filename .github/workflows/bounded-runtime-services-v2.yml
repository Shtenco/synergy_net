name: Bounded Runtime Services v2

on:
  pull_request:
    paths:
      - 'src/synergynet/content_service_v2.py'
      - 'src/synergynet/relay_service_v2.py'
      - 'config/runtime_services_v2.json'
      - 'schemas/synergynet_runtime_source_v2.schema.json'
      - 'tests/test_runtime_services_v2.py'
      - 'tests/test_runtime_source_manifest_v2.py'
      - 'docs/BOUNDED_RUNTIME_SERVICES_V2.md'
      - '.github/workflows/bounded-runtime-services-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest jsonschema
      - run: python -m pip install -e .
      - run: pytest -q tests/test_runtime_services_v2.py tests/test_runtime_source_manifest_v2.py
