name: SynergyNet Build Recipe v2

on:
  pull_request:
    paths:
      - 'config/build_recipe_v2.json'
      - 'src/synergynet/build_recipe_v2.py'
      - 'schemas/synergy_build_recipe_v2.schema.json'
      - 'tests/test_build_recipe_v2.py'
      - 'docs/BUILD_RECIPE_V2.md'
      - '.github/workflows/build-recipe-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest jsonschema
      - run: python -m pip install -e .
      - run: pytest -q tests/test_service_spec_v2.py tests/test_build_recipe_v2.py
