name: Persistent Content Service v1

on:
  pull_request:
    paths:
      - 'src/synergynet/persistent_service_v1.py'
      - 'tests/test_persistent_content_service_v1.py'
      - 'config/persistent_content_service_v1.json'
      - 'docs/PERSISTENT_CONTENT_SERVICE_V1.md'
      - '.github/workflows/persistent-content-service-v1.yml'
  workflow_dispatch:

concurrency:
  group: persistent-content-service-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_persistent_content_service_v1.py
