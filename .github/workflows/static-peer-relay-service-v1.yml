name: Static Peer Relay Service v1

on:
  pull_request:
    paths:
      - 'src/synergynet/static_relay_v1.py'
      - 'tests/test_static_peer_relay_v1.py'
      - 'config/static_peer_relay_service_v1.json'
      - 'docs/STATIC_PEER_RELAY_SERVICE_V1.md'
      - '.github/workflows/static-peer-relay-service-v1.yml'
  workflow_dispatch:

concurrency:
  group: static-peer-relay-service-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_static_peer_relay_v1.py
